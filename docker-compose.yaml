version: '3.8'

services:
  selenium-chrome:
    image: selenium/standalone-chrome:latest
    container_name: selenium-chrome
    shm_size: 2gb # Crucial: prevents Chrome from crashing due to memory starvation
    ports:
      - "4444:4444" # Selenium Grid Hub
      - "7900:7900" # noVNC Web Interface
    environment:
      - SE_NODE_MAX_SESSIONS=4
      - SE_NODE_SESSION_TIMEOUT=300
      - VNC_NO_PASSWORD=1 # Bypass the VNC password prompt (or use SE_VNC_PASSWORD=secret)
    networks:
      - test-network

  test-runner:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: test-runner
    depends_on:
      - selenium-chrome
    environment:
      - TestSettings__UseGrid=true
      - TestSettings__GridUrl=http://selenium-chrome:4444/wd/hub
    volumes:
      # Mount results and logs back to your Windows host machine
      - ./TestResults:/app/bin/Release/net8.0/TestResults
      - ./Logs:/app/Logs
    networks:
      - test-network

networks:
  test-network:
    driver: bridge